name: Deploy FleetTrack to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Next.js Static Export
        run: |
          cd frontend
          npm install
          npm run build
          touch out/.nojekyll
        env:
          NEXT_PUBLIC_API_URL: ''
          NEXT_PUBLIC_WS_URL: ''

      - name: Deploy to gh-pages Branch
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/out
          force_orphan: true
